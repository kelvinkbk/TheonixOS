<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Theonix Quick Settings Prototype</title>
<style>
  :root{
    --bg:#0f1217;
    --panel:#171c24;
    --tile:#202631;
    --tile-hover:#29313d;
    --border:#333c49;
    --text:#f4f7fb;
    --muted:#9ca7b7;
    --accent:#7b61ff;
    --accent-2:#12d8c5;
    --shadow:0 24px 60px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:32px;
    background:#080a0e;
    color:var(--text);
    font-family:Inter,Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .showcase{
    width:min(460px,100%);
    position:relative;
  }
  .panel{
    background:linear-gradient(145deg,rgba(25,30,40,.98),rgba(14,18,25,.99));
    border:1px solid var(--border);
    border-radius:24px;
    padding:18px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
  }
  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
  }
  .title{
    font-size:19px;
    font-weight:750;
    letter-spacing:-.02em;
  }
  .subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  .edit{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    border-radius:10px;
    padding:7px 10px;
    font-size:12px;
  }
  .edit:hover{background:#242b36}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }
  .tile{
    min-height:76px;
    border:1px solid var(--border);
    border-radius:16px;
    background:var(--tile);
    color:var(--text);
    padding:12px;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:.14s ease;
  }
  .tile:hover{
    background:var(--tile-hover);
    transform:translateY(-1px);
  }
  .tile.on{
    background:linear-gradient(135deg,rgba(123,97,255,.30),rgba(18,216,197,.08));
    border-color:#5c4fbd;
  }
  .tile-main{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .icon{
    width:35px;
    height:35px;
    border-radius:11px;
    background:#2b333f;
    display:grid;
    place-items:center;
    flex:0 0 auto;
    font-size:17px;
  }
  .on .icon{background:rgba(123,97,255,.34)}
  .label{
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
  }
  .state{
    margin-top:3px;
    color:var(--muted);
    font-size:11px;
  }
  .arrow{color:var(--muted);font-size:16px}
  .controls{
    display:grid;
    gap:10px;
    margin-top:13px;
  }
  .control{
    background:var(--tile);
    border:1px solid var(--border);
    border-radius:16px;
    padding:13px;
  }
  .control-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
    font-size:12px;
  }
  .value{font-weight:750}
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .footer{
    border-top:1px solid var(--border);
    margin-top:14px;
    padding-top:13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .status{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent-2);
    box-shadow:0 0 12px rgba(18,216,197,.8);
    flex:0 0 auto;
  }
  .status-title{font-size:13px;font-weight:700}
  .status-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .actions{display:flex;gap:8px}
  .circle{
    width:38px;height:38px;
    border:1px solid var(--border);
    background:var(--tile);
    color:var(--text);
    border-radius:12px;
  }
  .circle:hover{background:var(--tile-hover)}
  .toast{
    position:absolute;
    right:8px;
    top:-52px;
    background:#0d1117;
    border:1px solid var(--border);
    padding:9px 12px;
    border-radius:10px;
    color:var(--text);
    font-size:12px;
    opacity:0;
    transform:translateY(5px);
    pointer-events:none;
    transition:.2s ease;
  }
  .toast.show{opacity:1;transform:none}
  .caption{
    margin-top:12px;
    text-align:center;
    color:#798493;
    font-size:11px;
  }
  @media (max-width:420px){
    body{padding:16px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <main class="showcase">
    <div id="toast" class="toast" aria-live="polite"></div>

    <section class="panel" aria-label="Theonix Quick Settings">
      <div class="header">
        <div>
          <div class="title">Quick Settings</div>
          <div class="subtitle">Theonix Control Center</div>
        </div>
        <button id="editBtn" class="edit" type="button">✎ Edit</button>
      </div>

      <div class="grid">
        <button class="tile on" type="button" data-key="wifi">
          <div class="tile-main">
            <span class="icon">⌁</span>
            <span>
              <div class="label">Wi‑Fi</div>
              <div class="state" data-state="wifi">Theonix_5G</div>
            </span>
          </div>
          <span class="arrow">›</span>
        </button>

        <button class="tile on" type="button" data-key="bluetooth">
          <div class="tile-main">
            <span class="icon">ᛒ</span>
            <span>
              <div class="label">Bluetooth</div>
              <div class="state" data-state="bluetooth">Connected</div>
            </span>
          </div>
          <span class="arrow">›</span>
        </button>

        <button class="tile" type="button" data-key="airplane">
          <div class="tile-main">
            <span class="icon">✈</span>
            <span>
              <div class="label">Airplane mode</div>
              <div class="state" data-state="airplane">Off</div>
            </span>
          </div>
        </button>

        <button class="tile" type="button" data-key="night">
          <div class="tile-main">
            <span class="icon">☾</span>
            <span>
              <div class="label">Night Light</div>
              <div class="state" data-state="night">Off</div>
            </span>
          </div>
        </button>

        <button class="tile on" type="button" data-key="battery">
          <div class="tile-main">
            <span class="icon">▣</span>
            <span>
              <div class="label">Battery Saver</div>
              <div class="state" data-state="battery">On • 78%</div>
            </span>
          </div>
        </button>

        <button class="tile" type="button" data-key="focus">
          <div class="tile-main">
            <span class="icon">◉</span>
            <span>
              <div class="label">Focus</div>
              <div class="state" data-state="focus">Off</div>
            </span>
          </div>
        </button>
      </div>

      <div class="controls">
        <div class="control">
          <div class="control-top">
            <span>☼ Brightness</span>
            <span id="brightValue" class="value">72%</span>
          </div>
          <input id="brightness" type="range" min="0" max="100" value="72" aria-label="Brightness">
        </div>

        <div class="control">
          <div class="control-top">
            <span>🔊 Volume</span>
            <span id="volumeValue" class="value">48%</span>
          </div>
          <input id="volume" type="range" min="0" max="100" value="48" aria-label="Volume">
        </div>
      </div>

      <div class="footer">
        <div class="status">
          <span class="dot"></span>
          <div>
            <div class="status-title">THAID Ready</div>
            <div class="status-sub">Local AI • Qwen 3.5 4B</div>
          </div>
        </div>
        <div class="actions">
          <button id="settingsBtn" class="circle" type="button" aria-label="Open Theonix Settings">⚙</button>
          <button id="lockBtn" class="circle" type="button" aria-label="Lock screen">⌁</button>
        </div>
      </div>
    </section>

    <div class="caption">Prototype — designed as a taskbar Quick Settings popup</div>
  </main>

<script>
(() => {
  const root = document.querySelector('.showcase');
  const toast = document.getElementById('toast');

  const state = {
    wifi: true,
    bluetooth: true,
    airplane: false,
    night: false,
    battery: true,
    focus: false
  };

  const labels = {
    wifi: ['Theonix_5G', 'Off'],
    bluetooth: ['Connected', 'Off'],
    airplane: ['On', 'Off'],
    night: ['On', 'Off'],
    battery: ['On • 78%', 'Off'],
    focus: ['On', 'Off']
  };

  function notify(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => toast.classList.remove('show'), 1500);
  }

  root.querySelectorAll('[data-key]').forEach(tile => {
    tile.addEventListener('click', () => {
      const key = tile.dataset.key;
      state[key] = !state[key];
      tile.classList.toggle('on', state[key]);

      const target = root.querySelector(`[data-state="${key}"]`);
      if (target) {
        target.textContent = labels[key][state[key] ? 0 : 1];
      }

      notify(`${target ? target.textContent : key}`);
    });
  });

  const brightness = document.getElementById('brightness');
  const volume = document.getElementById('volume');

  brightness.addEventListener('input', () => {
    document.getElementById('brightValue').textContent = `${brightness.value}%`;
  });

  volume.addEventListener('input', () => {
    document.getElementById('volumeValue').textContent = `${volume.value}%`;
  });

  document.getElementById('editBtn').addEventListener('click', () => {
    notify('Quick Settings edit mode');
  });

  document.getElementById('settingsBtn').addEventListener('click', () => {
    notify('Open Theonix Settings');
  });

  document.getElementById('lockBtn').addEventListener('click', () => {
    notify('Lock screen requested');
  });
})();
</script>
</body>
</html>
