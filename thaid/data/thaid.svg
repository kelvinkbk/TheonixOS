<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neural Energy Gradients -->
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFAA" />
      <stop offset="50%" stop-color="#00B8D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Radial Core Highlight -->
    <radialGradient id="coreRadial" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#00FFAA" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00B8D4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00FFAA" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bgGrad)" stroke="url(#glassRim)" stroke-width="2.5" />

  <!-- Ambient Outer Glow Orb -->
  <circle cx="128" cy="128" r="64" fill="url(#neuralGrad)" opacity="0.25" filter="url(#aiGlow)" />

  <!-- Outer Soundwave / Neural Quantum Rings -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="url(#pulseGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="128" cy="128" r="68" fill="none" stroke="url(#neuralGrad)" stroke-width="2.5" opacity="0.75" />

  <!-- Central Floating Dark Sphere -->
  <circle cx="128" cy="128" r="54" fill="#050814" stroke="url(#neuralGrad)" stroke-width="3" />

  <!-- Glowing Neural Core -->
  <circle cx="128" cy="128" r="44" fill="url(#coreRadial)" filter="url(#coreGlow)" />

  <!-- Modern Waveform AI Dynamic Ribbons -->
  <path d="M 94 128 Q 111 96 128 128 T 162 128" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" filter="url(#coreGlow)" />
  <path d="M 102 128 Q 115 146 128 128 T 154 128" fill="none" stroke="#00FFAA" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Quantum Particle Nodes -->
  <circle cx="94" cy="128" r="4" fill="#00FFAA" />
  <circle cx="128" cy="128" r="5" fill="#FFFFFF" filter="url(#coreGlow)" />
  <circle cx="162" cy="128" r="4" fill="#8B5CF6" />

  <!-- Sparkle Highlights -->
  <circle cx="110" cy="100" r="2.5" fill="#FFFFFF" opacity="0.9" filter="url(#coreGlow)" />
  <circle cx="148" cy="154" r="2" fill="#00FFAA" opacity="0.8" />
  <circle cx="150" cy="98" r="1.5" fill="#38BDF8" opacity="0.7" />
</svg>
